[package]
name = "vol3-symbol-manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vol3sm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
glob = "0.3"
colored = "3"
indicatif = "0.18"
